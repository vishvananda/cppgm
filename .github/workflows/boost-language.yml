name: Boost language correctness

on:
  workflow_call:
  workflow_dispatch:
    inputs:
      full:
        description: Run the full recovered Boost inventory
        type: boolean
        default: false
      edition:
        description: Edition to replay on a full run
        type: choice
        options: [all, '14', '17', '20']
        default: all

permissions:
  contents: read

jobs:
  replay:
    runs-on: ubuntu-24.04
    container:
      image: ubuntu:26.04
    timeout-minutes: 360
    steps:
      - name: Install compiler and Boost.Build dependencies
        env:
          FULL: ${{ inputs.full || false }}
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            ca-certificates curl g++-15 gcc-15 git make python3
          if [ "$FULL" = true ]; then
            apt-get install -y --no-install-recommends \
              libssl-dev libgmp-dev libmpfr-dev libopenmpi-dev openmpi-bin \
              python3-dev python3-numpy nlohmann-json3-dev zlib1g-dev libicu-dev
          fi

      - uses: actions/checkout@v6

      - name: Restore the compiler built by Tests
        if: github.event_name != 'workflow_dispatch'
        uses: actions/download-artifact@v7
        with:
          name: cppgm-build-ubuntu-26.04-gcc-${{ github.sha }}
          path: tested-compiler

      - name: Prepare cppgm
        run: |
          if [ -f tested-compiler/cppgm-build.tar.gz ]; then
            tar -xzf tested-compiler/cppgm-build.tar.gz dev/cppgm
          else
            make -C dev -j2 cppgm CXX=g++-15 CPPGM_HOST_CXX=g++-15
          fi
          dev/cppgm --version

      - name: Cache pinned Boost archive
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/boost_1_92_0.tar.bz2
          key: boost-1.92.0-5c1d40cb8e19adbf740a4ec2da35b3e58f3f5804b1dce44deb53df72193cbc6c

      - name: Fetch pinned Boost
        run: |
          archive="$RUNNER_TEMP/boost_1_92_0.tar.bz2"
          if [ ! -f "$archive" ]; then
            curl --fail --location --retry 3 \
              https://archives.boost.io/release/1.92.0/source/boost_1_92_0.tar.bz2 \
              --output "$archive"
          fi
          echo "5c1d40cb8e19adbf740a4ec2da35b3e58f3f5804b1dce44deb53df72193cbc6c  $archive" | sha256sum --check

      - name: Build the Python interpreter for Parameter.Python
        if: inputs.full && (inputs.edition == 'all' || inputs.edition == '14')
        shell: bash
        run: |
          apt-get install -y --no-install-recommends xz-utils
          cd "$RUNNER_TEMP"
          archive=Python-3.9.25.tar.xz
          curl --fail --location --retry 3 --output "$archive" \
            "https://www.python.org/ftp/python/3.9.25/$archive"
          echo "00e07d7c0f2f0cc002432d1ee84d2a40dae404a99303e3f97701c10966c91834  $archive" | sha256sum --check
          tar -xf "$archive"
          cd Python-3.9.25
          prefix="$RUNNER_TEMP/boost-python39"
          CC=gcc-15 LDFLAGS="-Wl,-rpath,$prefix/lib" ./configure --prefix="$prefix" --enable-shared --without-ensurepip
          make -j2
          make install

      - name: Replay the original Boost.Build checks
        shell: bash
        env:
          FULL: ${{ inputs.full || false }}
          EDITION: ${{ inputs.edition || 'all' }}
        run: |
          replay=()
          if [ "$FULL" != true ]; then
            replay+=(--smoke)
          else
            printf '%s\n' 'using mpi : : : mpirun --allow-run-as-root --oversubscribe -np ;' > "$RUNNER_TEMP/boost-mpi.jam"
            replay+=(--extra-user-config "$RUNNER_TEMP/boost-mpi.jam")
          fi
          if [ "$FULL" = true ] && [ "$EDITION" != all ]; then
            replay+=(--edition "$EDITION")
          fi
          if [ "$FULL" = true ] && { [ "$EDITION" = all ] || [ "$EDITION" = 14 ]; }; then
            replay+=(--python39 "$RUNNER_TEMP/boost-python39")
          fi
          python3 scripts/run_boost_language_replay.py \
            --archive "$RUNNER_TEMP/boost_1_92_0.tar.bz2" --compiler dev/cppgm \
            --reference g++-15 --jobs 2 --output "$RUNNER_TEMP/boost-language" \
            "${replay[@]}"

      - name: Retain replay receipts
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: boost-language-${{ github.sha }}
          path: |
            ${{ runner.temp }}/boost-language/results.json
            ${{ runner.temp }}/boost-language/[0-9]*/*/results.json
            ${{ runner.temp }}/boost-language/[0-9]*/*/b2.log
            ${{ runner.temp }}/boost-language/[0-9]*/*/b2.xml
            ${{ runner.temp }}/boost-language/[0-9]*/*/invocations.jsonl
