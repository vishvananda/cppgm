name: Upstream C++11 correctness

on:
  workflow_call:
    inputs:
      use-tests-build:
        type: boolean
        default: false
  workflow_dispatch:
  schedule:
    - cron: '33 5 * * 1'

permissions:
  contents: read

# A new push to a pull request cancels that pull request's earlier run. No other run is cancelled.
concurrency:
  group: upstream-cxx11-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  upstream-cxx11:
    # These are two independently reported jobs; a failure cannot cancel its peer.
    name: ${{ matrix.suite }} C++11 correctness and suite timing
    runs-on: ubuntu-24.04
    container:
      image: ubuntu@sha256:6a06111c3b0a8600feadb270aec771dc239bf407b25625f93f44ab00e11f4d3c # 26.04
      # The minimal image has no CA bundle. Bootstrap HTTPS with the runner's
      # trust store; installing ca-certificates can then populate the image's.
      options: --volume /etc/ssl/certs/ca-certificates.crt:/usr/local/share/cppgm-ci/host-ca-certificates.crt:ro
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - suite: gcc
            repository: gcc-mirror/gcc
            revision: 5115c7e447fc07457443df874bf57840e8316d5f
            sparse: |
              gcc/testsuite/g++.dg/cpp0x
              gcc/testsuite/g++.dg/cpp1y
              gcc/testsuite/g++.dg/cpp1z
              gcc/testsuite/g++.dg/cpp2a
              gcc/testsuite/g++.dg/concepts
              gcc/testsuite/g++.dg/coroutines
              gcc/testsuite/gcc.dg
              gcc/testsuite/gcc.c-torture/execute
              libstdc++-v3/testsuite/18_support/coroutines
              libstdc++-v3/testsuite/20_util/exchange
              libstdc++-v3/testsuite/20_util/is_invocable
              libstdc++-v3/testsuite/20_util/variant
            upstream: g++-15
            version: 15.2.0
          - suite: clang
            repository: llvm/llvm-project
            revision: 2078da43e25a4623cab2d0d60decddf709aaea28
            sparse: |
              clang/test
              llvm/utils/lit
            upstream: clang++-21
            version: 21.1.8
    defaults:
      run:
        shell: bash
    env:
      CXX: g++-15
      CPPGM_HOST_CXX: g++-15
      CPPGM_WARNINGS_AS_ERRORS: "1"
      # The one statement of the pinned package snapshot: the source list and the cache key use it.
      UBUNTU_SNAPSHOT: 20261107T000000Z

    steps:
      - name: Initialize retained setup evidence
        run: |
          mkdir -p "$RUNNER_TEMP/cxx11/environment"
          uname -a > "$RUNNER_TEMP/cxx11/environment/platform.txt"
          cat /etc/os-release > "$RUNNER_TEMP/cxx11/environment/os-release.txt"
          printf '%s\n' 'ubuntu@sha256:6a06111c3b0a8600feadb270aec771dc239bf407b25625f93f44ab00e11f4d3c' \
            > "$RUNNER_TEMP/cxx11/environment/container.txt"

      # The snapshot never changes, so its package lists and archives are cached. A cached run
      # reads nothing from the snapshot service; apt still checks each archive against the signed lists.
      # Raise the key's last part when the installed packages change: a saved cache is never updated.
      - name: Restore the snapshot's package lists and archives
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ runner.temp }}/cxx11-apt
          key: cxx11-apt-${{ env.UBUNTU_SNAPSHOT }}-${{ matrix.suite }}-v1

      - name: Install snapshot-pinned compiler and metadata tools
        run: |
          set -euo pipefail
          exec > >(tee -a "$RUNNER_TEMP/cxx11/environment/setup.log") 2>&1
          # The signed snapshot fixes the complete dependency universe, not just
          # the named compiler packages. Release expiry is irrelevant to a fixed snapshot.
          cat > "$RUNNER_TEMP/cxx11/environment/ubuntu.sources" <<'SOURCES'
          Types: deb
          URIs: https://snapshot.ubuntu.com/ubuntu/${{ env.UBUNTU_SNAPSHOT }}/
          Suites: resolute resolute-updates resolute-security
          Components: main universe
          Signed-By: /usr/share/keyrings/ubuntu-archive-keyring.gpg
          Check-Valid-Until: no
          SOURCES
          apt_cache="$RUNNER_TEMP/cxx11-apt"
          mkdir -p "$apt_cache/lists/partial" "$apt_cache/archives/partial"
          apt_options=(-o "Dir::Etc::sourcelist=$RUNNER_TEMP/cxx11/environment/ubuntu.sources"
                       -o Dir::Etc::sourceparts=-
                       -o Acquire::https::CaInfo=/usr/local/share/cppgm-ci/host-ca-certificates.crt
                       -o "Dir::State::lists=$apt_cache/lists"
                       -o "Dir::Cache::archives=$apt_cache/archives"
                       -o Acquire::Retries=5)
          if [ -e "$apt_cache/lists-complete" ]; then
            echo "Using the cached package lists of the snapshot."
          else
            apt-get "${apt_options[@]}" update
            touch "$apt_cache/lists-complete"
          fi
          apt-get "${apt_options[@]}" install -y --no-install-recommends \
            ca-certificates git make python3 \
            g++-15=15.2.0-16ubuntu1 \
            tcl=8.6.16build1 dejagnu=1.6.3-2
          if [ '${{ matrix.suite }}' = clang ]; then
            apt-get "${apt_options[@]}" install -y --no-install-recommends clang-21=1:21.1.8-6ubuntu1
            case "$GITHUB_EVENT_NAME" in
              schedule|workflow_dispatch)
                apt-get "${apt_options[@]}" install -y --no-install-recommends \
                  csmith=2.3.0-8build1 libcsmith-dev=2.3.0-8build1
                ;;
            esac
          fi
          dpkg-query -W > "$RUNNER_TEMP/cxx11/environment/packages.txt"
          env | sort | sed -n '/^CPPGM_/p; /^CXX=/p' > "$RUNNER_TEMP/cxx11/environment/build.txt"

      - name: Check out compiler
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Check out pinned upstream tests and native metadata parser
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: ${{ matrix.repository }}
          ref: ${{ matrix.revision }}
          path: upstream-sources
          sparse-checkout: ${{ matrix.sparse }}
          persist-credentials: false

      - name: Check out pinned C runtime tests
        if: matrix.suite == 'gcc'
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: c-testsuite/c-testsuite
          ref: 5c7275656d751de0e68b2d340a95b5681858ed07
          path: c-testsuite
          persist-credentials: false

      - name: Retain source license notices
        run: |
          python3 - <<'PYCODE'
          import hashlib, json, os, shutil
          from pathlib import Path
          output = Path(os.environ['RUNNER_TEMP'])/'cxx11/licenses'
          output.mkdir()
          records = []
          sources = [(Path('.'), ['NOTICE', 'LICENSE', 'LICENSE.txt', 'COPYING']),
                     (Path('upstream-sources'), ['COPYING', 'COPYING3', 'COPYING.RUNTIME',
                                                 'LICENSE.TXT', 'clang/LICENSE.TXT', 'llvm/LICENSE.TXT'])]
          if Path('c-testsuite').is_dir():
              sources.append((Path('c-testsuite'), ['LICENSE', 'tests/LICENSE']))
          for root, names in sources:
              found = 0
              for name in names:
                  source = root/name
                  if source.is_file():
                      target = output/root.name/name if root.name else output/'compiler'/name
                      target.parent.mkdir(parents=True, exist_ok=True)
                      shutil.copyfile(source, target)
                      records.append(dict(source=str(source), artifact=str(target.relative_to(output)),
                                          sha256=hashlib.sha256(target.read_bytes()).hexdigest()))
                      found += 1
              if not found:
                  raise RuntimeError('No source license notice found in '+str(root))
          (output/'manifest.json').write_text(json.dumps(records, indent=2)+'\n')
          PYCODE

      - name: Restore same-revision compiler from Tests
        if: inputs.use-tests-build
        id: tested-build
        continue-on-error: true
        uses: actions/download-artifact@v7
        with:
          name: cppgm-build-ubuntu-26.04-gcc-${{ github.sha }}
          path: tested-compiler

      - name: Prepare cppgm
        id: candidate
        run: |
          set -euo pipefail
          ulimit -c 0
          if [ '${{ steps.tested-build.outcome }}' = success ] &&
             tar -xzf tested-compiler/cppgm-build.tar.gz dev/cppgm &&
             dev/cppgm --version; then
            cp tested-compiler/metadata.env "$RUNNER_TEMP/cxx11/environment/candidate-build.env"
            exit 0
          fi
          make -C dev -j2 cppgm CXX="$CXX" CPPGM_HOST_CXX="$CPPGM_HOST_CXX"

      - name: Restore pinned discovery manifests
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ${{ runner.temp }}/cxx11/manifest.json
            ${{ runner.temp }}/cxx11/cxx*/discovery.json
          key: >-
            upstream-manifests-v1-${{ matrix.suite }}-${{ matrix.revision }}-${{ env.UBUNTU_SNAPSHOT }}-${{
              hashFiles('scripts/build_*_cxx11_ci_manifest.py', 'scripts/upstream_*.py', 'reports/*cxx11*.json') }}

      - name: Freeze language test manifest
        run: |
          if [ -s "$RUNNER_TEMP/cxx11/manifest.json" ]; then
            exit 0
          fi
          set -euo pipefail
          if [ '${{ matrix.suite }}' = gcc ]; then
            python3 scripts/build_gcc_cxx11_ci_manifest.py \
              --gcc-root upstream-sources --dejagnu-library /usr/share/dejagnu \
              --output "$RUNNER_TEMP/cxx11/manifest.json"
          else
            python3 scripts/build_clang_cxx11_ci_manifest.py \
              --llvm-root upstream-sources --verify-negatives --implicit-cxx11 --llvm-object-projections --local-inputs \
              --standalone-llvm-only-projections \
              --output "$RUNNER_TEMP/cxx11/manifest.json"
          fi

      - name: Qualify implicit-mode sources with strict native C++11
        if: matrix.suite == 'clang'
        id: qualification
        # Retain applicability failures and still run both normal compilers.
        continue-on-error: true
        run: |
          python3 scripts/qualify_clang_cxx11_ci_manifest.py \
            --manifest "$RUNNER_TEMP/cxx11/manifest.json" \
            --source-root upstream-sources --upstream '${{ matrix.upstream }}' \
            --upstream-version '${{ matrix.version }}' --workers 2 \
            --output "$RUNNER_TEMP/cxx11/qualification"

      - name: Run identical suite with cppgm and upstream compiler
        run: |
          ulimit -c 0
          python3 scripts/run_cxx11_ci_suite.py \
            --manifest "$RUNNER_TEMP/cxx11/manifest.json" \
            --source-root upstream-sources --candidate dev/cppgm \
            --upstream '${{ matrix.upstream }}' --upstream-version '${{ matrix.version }}' \
            --workers 2 --output "$RUNNER_TEMP/cxx11/run"

      - name: Require successful native C++11 qualification
        if: always() && matrix.suite == 'clang'
        run: test '${{ steps.qualification.outcome }}' = success

      - name: Check reviewed C++14, C++17 and C++20 cases
        if: ${{ !cancelled() && steps.candidate.outcome == 'success' }}
        env:
          SUITE: ${{ matrix.suite }}
          UPSTREAM: ${{ matrix.upstream }}
          UPSTREAM_VERSION: ${{ matrix.version }}
          EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          profile=full
          if [ "$EVENT" = pull_request ]; then
            profile=pr
          fi
          failed=0
          for edition in 14 17 20; do
            output="$RUNNER_TEMP/cxx11/cxx$edition"
            mkdir -p "$output"
            if [ "$SUITE" = gcc ]; then
              adapter=(scripts/build_gcc_cxx11_ci_manifest.py --gcc-root upstream-sources
                       --dejagnu-library /usr/share/dejagnu)
            else
              adapter=(scripts/build_clang_cxx11_ci_manifest.py --llvm-root upstream-sources
                       --verify-negatives --local-inputs)
            fi
            if [ ! -s "$output/discovery.json" ] &&
               ! python3 "${adapter[@]}" --edition "$edition" --output "$output/discovery.json"; then
              failed=1
              continue
            fi
            if ! python3 scripts/select_upstream_cxx_cohort.py --profile "$profile" \
                   --discovery "$output/discovery.json" --output "$output/manifest.json"; then
              failed=1
              continue
            fi
            if [ "$SUITE" = clang ]; then
              python3 scripts/qualify_clang_cxx11_ci_manifest.py \
                --manifest "$output/manifest.json" --source-root upstream-sources \
                --upstream "$UPSTREAM" --upstream-version "$UPSTREAM_VERSION" \
                --workers 2 --output "$output/qualification" || failed=1
            fi
            python3 scripts/run_cxx11_ci_suite.py --manifest "$output/manifest.json" \
              --source-root upstream-sources --candidate dev/cppgm \
              --upstream "$UPSTREAM" --upstream-version "$UPSTREAM_VERSION" \
              --workers 2 --output "$output/run" || failed=1
          done
          exit "$failed"

      - name: Run hosted GCC and libstdc++ compliance cases
        if: ${{ !cancelled() && steps.candidate.outcome == 'success' && matrix.suite == 'gcc' }}
        env:
          UPSTREAM: ${{ matrix.upstream }}
          UPSTREAM_VERSION: ${{ matrix.version }}
        run: |
          set -euo pipefail
          failed=0
          for edition in 17 20; do
            python3 scripts/run_cxx11_ci_suite.py \
              --manifest "reports/upstream-gcc-hosted-cxx$edition.json" \
              --source-root upstream-sources --candidate dev/cppgm \
              --upstream "$UPSTREAM" --upstream-version "$UPSTREAM_VERSION" \
              --workers 2 --output "$RUNNER_TEMP/cxx11/hosted-cxx$edition" || failed=1
          done
          exit "$failed"

      - name: Run C language and runtime tests
        if: ${{ !cancelled() && steps.candidate.outcome == 'success' }}
        env:
          SUITE: ${{ matrix.suite }}
          UPSTREAM_VERSION: ${{ matrix.version }}
        run: |
          set -euo pipefail
          case "$SUITE" in
            gcc) upstream_c=gcc-15; editions=(90 95 99 11 17) ;;
            clang) upstream_c=clang-21; editions=(90 99 11 17) ;;
          esac
          failed=0
          for edition in "${editions[@]}"; do
            python3 scripts/run_cxx11_ci_suite.py \
              --manifest "reports/upstream-$SUITE-c$edition.json" \
              --source-root upstream-sources --candidate dev/cppgm \
              --upstream "$upstream_c" --upstream-version "$UPSTREAM_VERSION" \
              --workers 2 --output "$RUNNER_TEMP/cxx11/c$edition" || failed=1
          done
          if [ "$SUITE" = gcc ]; then
            python3 scripts/build_c_testsuite_ci_manifest.py \
              --source-root c-testsuite --known-gaps reports/upstream-c-testsuite-known-gaps.json \
              --output "$RUNNER_TEMP/cxx11/c-testsuite.json"
            python3 scripts/run_cxx11_ci_suite.py --manifest "$RUNNER_TEMP/cxx11/c-testsuite.json" \
              --source-root c-testsuite --candidate dev/cppgm \
              --upstream "$upstream_c" --upstream-version "$UPSTREAM_VERSION" \
              --workers 2 --output "$RUNNER_TEMP/cxx11/c-testsuite" || failed=1
          fi
          exit "$failed"

      - name: Run pinned Csmith differential checks
        if: ${{ !cancelled() && steps.candidate.outcome == 'success' && matrix.suite == 'clang' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') }}
        run: |
          python3 scripts/run_csmith_ci_suite.py --candidate dev/cppgm \
            --runtime-headers /usr/include/csmith --gcc gcc-15 --clang clang-21 \
            --workers 2 --output "$RUNNER_TEMP/cxx11/csmith"

      - name: Run GCC C torture checks
        if: ${{ !cancelled() && steps.candidate.outcome == 'success' && matrix.suite == 'gcc' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') }}
        run: |
          python3 scripts/run_gcc_c_torture_ci_suite.py --candidate dev/cppgm \
            --gcc gcc-15 --source-root upstream-sources \
            --known-gaps reports/upstream-gcc-c-torture-known-gaps.json \
            --workers 2 --output "$RUNNER_TEMP/cxx11/gcc-c-torture"

      - name: Run pinned musl libc-test cases
        if: ${{ !cancelled() && steps.candidate.outcome == 'success' && matrix.suite == 'gcc' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') }}
        env:
          UPSTREAM_VERSION: ${{ matrix.version }}
        run: |
          python3 scripts/run_musl_libc_test_ci_suite.py --candidate dev/cppgm \
            --gcc gcc-15 --upstream-version "$UPSTREAM_VERSION" --workers 2 \
            --work "$RUNNER_TEMP/musl-libc-test-build" --output "$RUNNER_TEMP/cxx11/libc-test"

      - name: Publish counts and elapsed-time ratio
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/cxx11/environment"
          if [ -f "$RUNNER_TEMP/cxx11/qualification/summary.md" ]; then
            cat "$RUNNER_TEMP/cxx11/qualification/summary.md" >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ -f "$RUNNER_TEMP/cxx11/run/summary.md" ]; then
            cat "$RUNNER_TEMP/cxx11/run/summary.md" >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'The suite did not produce a complete timing report; see the failed setup/run step.' >> "$GITHUB_STEP_SUMMARY"
          fi
          for edition in 14 17 20; do
            for report in qualification run; do
              summary="$RUNNER_TEMP/cxx11/cxx$edition/$report/summary.md"
              if [ -f "$summary" ]; then
                cat "$summary" >> "$GITHUB_STEP_SUMMARY"
              fi
            done
          done
          for edition in 17 20; do
            summary="$RUNNER_TEMP/cxx11/hosted-cxx$edition/summary.md"
            if [ -f "$summary" ]; then
              cat "$summary" >> "$GITHUB_STEP_SUMMARY"
            fi
          done
          for report in c99 c11 c17 c-testsuite csmith gcc-c-torture libc-test; do
            summary="$RUNNER_TEMP/cxx11/$report/summary.md"
            if [ -f "$summary" ]; then
              cat "$summary" >> "$GITHUB_STEP_SUMMARY"
            fi
          done
          tar -C "$RUNNER_TEMP" -czf "$RUNNER_TEMP/cxx11-${{ matrix.suite }}.tar.gz" cxx11

      - name: Retain manifest, commands, raw output and results for both compilers
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: cxx11-${{ matrix.suite }}-${{ github.sha }}
          path: ${{ runner.temp }}/cxx11-${{ matrix.suite }}.tar.gz
          if-no-files-found: error
          retention-days: 14
