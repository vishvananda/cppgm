name: Experimental AArch64 backend

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - dev/**
      - pa25/tests/general/200-runtime-custom-entry.*
      - pa38/**
      - pa39/**
      - pa35/**
      - pa37/benchmarks/**
      - scripts/check_arm_simd.pl
      - scripts/CppgmWasmBenchmark.pm
      - scripts/CppgmWasmApplications.pm
      - benchmarks/aarch64/**
      - pa36/kernels/**
      - scripts/check_aarch64.pl
      - scripts/check_cppgm_native_programs.pl
      - scripts/CppgmBatchWorker.pm
      - scripts/replay_aarch64.pl
      - scripts/CppgmBackendFixture.pm
      - scripts/CppgmArm64MachO.pm
      - scripts/replay_arm64_macos.pl
      - scripts/tests/*lowir_library_targets*
      - .github/workflows/aarch64.yml
  schedule:
    - cron: '17 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: arm-tests-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  cross:
    runs-on: ubuntu-24.04
    container: ubuntu:26.04
    timeout-minutes: 90
    env:
      CPPGM_AARCH64_CLANG: clang-22
      CPPGM_AARCH64_LLD: ld.lld-22
      CPPGM_AARCH64_AR: llvm-ar-22
      CPPGM_AARCH64_READOBJ: llvm-readobj-22
      CPPGM_AARCH64_OBJDUMP: llvm-objdump-22
      CPPGM_AARCH64_ARTIFACTS: ${{ github.workspace }}/obj/pa39-guests
    steps:
      - run: |
          apt-get update
          apt-get install -y --no-install-recommends build-essential ca-certificates git perl python3 \
            clang-22=1:22.1.2-1ubuntu1 llvm-22=1:22.1.2-1ubuntu1 lld-22=1:22.1.2-1ubuntu1 \
            g++-14-aarch64-linux-gnu=14.3.0-14ubuntu1cross1 qemu-user=1:10.2.1+ds-1ubuntu3.3 libgcc-14-dev-arm64-cross=14.3.0-14ubuntu1cross1 \
            libstdc++-14-dev-arm64-cross=14.3.0-14ubuntu1cross1 libc6-dev-arm64-cross=2.43-2ubuntu2cross1
      - uses: actions/checkout@v6
      - run: make test-pa39
      - name: Link and check typed LowIR library objects on both Arm targets
        run: |
          make -C dev lowir-library
          python3 scripts/tests/test_lowir_library_targets.py \
            --target aarch64-linux-gnu arm64-apple-macos11
      - run: perl scripts/replay_arm64_macos.pl build obj/pa39-macho
      - uses: actions/upload-artifact@v6
        with:
          name: pa39-macho
          path: obj/pa39-macho
      - uses: actions/upload-artifact@v6
        with:
          name: pa39-guests
          path: obj/pa39-guests
  native:
    name: Replay PA39 on Linux Arm64
    needs: cross
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v7
        with:
          name: pa39-guests
          path: guests
      - run: perl scripts/replay_aarch64.pl guests

  self-build:
    name: Native Arm64 SIMD and compiler self-build
    runs-on: ubuntu-24.04-arm
    container: ubuntu:26.04
    timeout-minutes: 150
    defaults:
      run:
        shell: bash
    env:
      CXX: g++-14 -static -fuse-ld=lld
      CPPGM_HOST_CXX: g++-14 -static -fuse-ld=lld
    steps:
      - run: |
          test "$(uname -m)" = aarch64
          apt-get update
          apt-get install -y --no-install-recommends build-essential ca-certificates g++-14 git llvm-22 lld-22 perl
          echo /usr/lib/llvm-22/bin >> "$GITHUB_PATH"
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Build the native seed compiler
        run: make -C dev cppgm
      - name: Run the PA37 scalar and SIMD workloads on Arm
        run: perl scripts/check_arm_simd.pl --objdump llvm-objdump-22
      - name: Rebuild cppgm with itself and compare generations
        run: |
          make -C pa35 compare-cppgm-inception CXX=../dev/cppgm \
            INCEPTION_EXTRA_CC_FLAGS="--target=aarch64-linux-gnu -fno-strict-aliasing" 2>&1 | tee "$RUNNER_TEMP/arm-self-build.log"
      - name: Run the SIMD checks with the self-built Arm compiler
        run: perl scripts/check_arm_simd.pl --compiler obj/pa35/bin/selfhost/cppgm-self --objdump llvm-objdump-22
      - if: always()
        uses: actions/upload-artifact@v6
        with:
          name: arm-self-build-log
          path: ${{ runner.temp }}/arm-self-build.log
          if-no-files-found: ignore

  native-macos:
    needs: cross
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
      - name: Build cppgm on Apple Silicon
        run: make -C dev cppgm lowir2native lowir-library CXX=clang++ CPPGM_HOST_CXX=clang++
      - name: Run C variable array programs on Apple Silicon
        run: make -C pa38 test-native-driver CPPGM_SKIP_DEV_REBUILD=1 CXX=clang++ CPPGM_HOST_CXX=clang++
      - name: Check C environment and custom startup on Apple Silicon
        run: |
          make -C pa38 test-native-driver CPPGM_SKIP_DEV_REBUILD=1 CXX=clang++ CPPGM_HOST_CXX=clang++ \
            NATIVE_DRIVER_TESTS='300-c-environment-hosted 500-c-integer-headers'
          make -C pa38 check CPPGM_SKIP_DEV_REBUILD=1 CXX=clang++ CPPGM_HOST_CXX=clang++ \
            TEST=tests/controls/500-c11-stdatomic.t
          make -C pa25 check RUN_CHECK_DEPS= CXX=clang++ CPPGM_HOST_CXX=clang++ \
            TEST=tests/general/200-runtime-custom-entry.t
      - name: Link and run typed LowIR library objects on Apple Silicon
        env:
          CPPGM_HOST_CXX: clang++
        run: python3 scripts/tests/test_lowir_library_targets.py --target arm64-apple-macos11
      - name: Compile the Apple ABI fixture with the native build
        run: |
          dev/cppgm --target=arm64-apple-macos11 -nostdinc -x c++ -c \
            pa39/tests/abi/400-apple-calling-convention.t -o "$RUNNER_TEMP/apple-abi.o"
      - uses: actions/download-artifact@v7
        with:
          name: pa39-macho
          path: macho
      - run: perl scripts/replay_arm64_macos.pl replay macho
