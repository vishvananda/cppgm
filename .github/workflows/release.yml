name: Release

# A semantic version tag (v0.9.0, v1.2.3-rc1) publishes a release. Assignment tags (assignments-v9) publish nothing.
# A pull request that changes the release files builds and checks the same packages without publishing.
on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+', 'v[0-9]+.[0-9]+.[0-9]+-*']
  pull_request:
    paths:
      - '.github/workflows/release.yml'
      - '.github/workflows/export-wasm-references.yml'
      - 'scripts/build_release_tools.sh'
      - 'scripts/package_release.py'
      - 'scripts/check_release_package.py'
      - 'dev/lowir_library.mk'
      - 'pa35/Makefile'
      - 'scripts/export_release_source.py'
      - 'scripts/tests/test_package_release.py'
      - 'scripts/tests/test_release_source.py'
      - 'BUILDING.md'
      - 'scripts/select_macos_llvm.sh'

permissions:
  contents: read

# A tag has one release producer. Never cancel an in-progress publication.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'push' }}

env:
  VERSION_TAG: ${{ github.event_name == 'push' && github.ref_name || 'v0.0.0' }}

jobs:
  wasm:
    if: github.event_name == 'push'
    uses: ./.github/workflows/export-wasm-references.yml
    with:
      revision: ${{ github.sha }}
      bundle: cppgm-${{ github.ref_name }}-wasm32-wasip1.tar.gz

  linux:
    name: ${{ matrix.platform }} tools and library
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x86_64
            runner: ubuntu-24.04
          - platform: linux-aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    env:
      PLATFORM: ${{ matrix.platform }}
      INCEPTION_EXTRA_CC_FLAGS: ${{ matrix.platform == 'linux-aarch64' && '-fno-strict-aliasing' || '' }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends binutils build-essential git gzip perl tar
      - name: Export both source packages
        if: matrix.platform == 'linux-x86_64'
        run: |
          set -euo pipefail
          # A pull request has no release tag: its trial tag names the checked-out commit.
          git rev-parse -q --verify "refs/tags/$VERSION_TAG" >/dev/null || git tag "$VERSION_TAG"
          python3 scripts/tests/test_release_source.py
          python3 scripts/tests/test_package_release.py
          python3 scripts/export_release_source.py --tag "$VERSION_TAG" --output "$RUNNER_TEMP/upload"
      - name: Build from the source-only download
        if: matrix.platform == 'linux-x86_64'
        run: |
          set -euo pipefail
          tar -xzf "$RUNNER_TEMP/upload/cppgm-${VERSION_TAG}-source.tar.gz" -C "$RUNNER_TEMP"
          cd "$RUNNER_TEMP/cppgm-$VERSION_TAG"
          make CXX=g++ CPPGM_HOST_CXX=g++
          dev/cppgm --version
          make -n -C dev lowir-library >/dev/null
      - name: Run the packaged PA1 suite
        if: matrix.platform == 'linux-x86_64'
        run: |
          set -euo pipefail
          # Both archives use the same source paths and timestamps. Reuse the stage-one build.
          tar -xzf "$RUNNER_TEMP/upload/cppgm-${VERSION_TAG}-source-with-tests.tar.gz" -C "$RUNNER_TEMP"
          cd "$RUNNER_TEMP/cppgm-$VERSION_TAG"
          make -C pa1 test
      - name: Build and check the native release package
        run: |
          set -euo pipefail
          if [[ "$PLATFORM" == linux-x86_64 ]]; then
            cd "$RUNNER_TEMP/cppgm-$VERSION_TAG"
          fi
          bash scripts/build_release_tools.sh g++
          # Record the checkout that supplied the source, including for a source archive.
          export GIT_DIR="$GITHUB_WORKSPACE/.git"
          python3 "$GITHUB_WORKSPACE/scripts/package_release.py" --root "$PWD" --tag "$VERSION_TAG" --platform "$PLATFORM" \
            --host "$(g++ --version | sed -n 1p)" --output "$RUNNER_TEMP/upload"
          python3 "$GITHUB_WORKSPACE/scripts/check_release_package.py" \
            "$RUNNER_TEMP/upload/cppgm-${VERSION_TAG}-${PLATFORM}.tar.gz" --host-cxx g++ --cc gcc
      # The package was built with GCC 13's headers. Ubuntu 26.04 has another GCC version: the packaged
      # compiler must find that version's headers.
      - name: Check the package on a system with another GCC version
        if: matrix.platform == 'linux-x86_64'
        run: |
          set -euo pipefail
          docker run --rm -v "$RUNNER_TEMP/upload:/upload:ro" -v "$PWD/scripts:/scripts:ro" \
            -e PACKAGE="/upload/cppgm-${VERSION_TAG}-linux-x86_64.tar.gz" ubuntu:26.04 bash -ec '
              apt-get update -q
              apt-get install -y -q --no-install-recommends g++ python3
              python3 /scripts/check_release_package.py "$PACKAGE" --host-cxx g++ --cc gcc'
      - uses: actions/upload-artifact@v6
        with:
          name: release-native-${{ matrix.platform }}
          path: ${{ runner.temp }}/upload/
          if-no-files-found: error

  macos:
    name: ${{ matrix.platform }} tools and library
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-x86_64
            runner: macos-26-intel
          - platform: macos-arm64
            runner: macos-15
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    env:
      CPPGM_STDLIB_FLAGS: ''
      CPPGM_HOST_CXX: clang++
      PLATFORM: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Install Homebrew LLVM Intel bottle
        if: matrix.platform == 'macos-x86_64'
        run: bash scripts/install_macos_llvm.sh 21
      - name: Select Homebrew LLVM
        if: matrix.platform == 'macos-x86_64'
        run: bash scripts/select_macos_llvm.sh 21
      - name: Build the tools and the LowIR library with cppgm
        run: bash scripts/build_release_tools.sh "$CPPGM_HOST_CXX"
      - name: Package and check the release files
        run: |
          set -euo pipefail
          python3 scripts/package_release.py --tag "$VERSION_TAG" --platform "$PLATFORM" \
            --host "$("$CPPGM_HOST_CXX" --version | sed -n 1p)" --output "$RUNNER_TEMP/upload"
          python3 scripts/check_release_package.py \
            "$RUNNER_TEMP/upload/cppgm-${VERSION_TAG}-${PLATFORM}.tar.gz" --host-cxx "$CPPGM_HOST_CXX" --cc cc
      - uses: actions/upload-artifact@v6
        with:
          name: release-native-${{ matrix.platform }}
          path: ${{ runner.temp }}/upload/
          if-no-files-found: error

  publish:
    if: github.event_name == 'push'
    needs: [wasm, linux, macos]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: reference-binaries-wasi
          path: wasi
      - uses: actions/download-artifact@v7
        with:
          pattern: release-native-*
          path: release
          merge-multiple: true
      - name: Publish the version's complete release once
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          cp wasi/*.tar.gz wasi/*.json release/
          cd release
          # A rerun must not overwrite published assets for a version tag.
          if gh release view "$VERSION_TAG" >/dev/null 2>&1; then
            echo "::error::This version already has a release; create a new version tag."
            exit 1
          fi
          sha256sum *.tar.gz *.json > SHA256SUMS
          cat > release-notes.md <<'NOTES'
          This release includes the native tools and LowIR library for Linux x86-64 and AArch64, Intel macOS and Apple Silicon, all nine tools as WASI modules, and two source downloads.

          Choose `cppgm-<tag>-source.tar.gz` to build the compiler, tools and library. Choose `cppgm-<tag>-source-with-tests.tar.gz` for the same code with the complete assignment suites, reference outputs, runners and course documentation. Each download can be used on its own.

          The native packages hold `bin/`, `lib/libcppgm_lowir` (static and shared) and `include/`. cppgm compiled these tools and the library: they are its second-stage build, and the third-stage build has the same bytes. Hosted compilation uses the host compiler and standard library that the package's README names; build from the source archive for another host.

          The WASI package holds all nine tools and a frozen header and SDK filesystem. The modules run in a WASI host or with the browser adapter; they are not standalone web pages.

          SHA256SUMS and the provenance records identify the source revision and the build inputs.
          NOTES
          prerelease=()
          case "$VERSION_TAG" in *-*) prerelease=(--prerelease) ;; esac
          gh release create "$VERSION_TAG" --verify-tag --draft "${prerelease[@]}" \
            --title "cppgm ${VERSION_TAG}" --notes-file release-notes.md \
            ./*.tar.gz ./*.json ./SHA256SUMS
          gh release edit "$VERSION_TAG" --draft=false
