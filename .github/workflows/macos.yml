name: Intel macOS port

on:
  push:
    branches: [main, v8macho]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: macos-port-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  CPPGM_WARNINGS_AS_ERRORS: "1"

jobs:
  native:
    name: Mach-O and self-hosting / LLVM ${{ matrix.llvm }}
    runs-on: macos-26-intel
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        llvm: [18, 21]
    env:
      CPPGM_STDLIB_FLAGS: ''
    steps:
      - uses: actions/checkout@v6
      - name: Install Homebrew LLVM Intel bottle
        run: bash scripts/install_macos_llvm.sh '${{ matrix.llvm }}'
      - name: Select Homebrew LLVM
        run: bash scripts/select_macos_llvm.sh '${{ matrix.llvm }}'
      - name: Build the compiler and native tools
        run: |
          sysctl hw.logicalcpu hw.physicalcpu machdep.cpu.brand_string
          /usr/bin/time -lp make -C dev -j4 CXX="$CXX" CPPGM_HOST_CXX="$CPPGM_HOST_CXX"
      - name: Check the mixed-toolchain vtable link
        run: |
          if ! make -C pa27 check CXX="$CXX" CPPGM_HOST_CXX="$CPPGM_HOST_CXX" \
              TEST=tests/general/200-host-extern-template-vtable-reference.t; then
            for diagnostic in pa27/tests/general/200-host-extern-template-vtable-reference.check*.impl.stderr; do
              if [ -f "$diagnostic" ]; then cat "$diagnostic"; fi
            done
            exit 1
          fi
      - name: Run C variable array programs on Intel macOS
        if: matrix.llvm == 21
        run: make -C pa38 test-native-driver CPPGM_SKIP_DEV_REBUILD=1 CXX="$CXX" CPPGM_HOST_CXX="$CPPGM_HOST_CXX"
      - name: Check the hosted C environment on Intel macOS
        if: matrix.llvm == 21
        run: |
          make -C pa38 test-native-driver CPPGM_SKIP_DEV_REBUILD=1 CXX="$CXX" CPPGM_HOST_CXX="$CPPGM_HOST_CXX" \
            NATIVE_DRIVER_TESTS='300-c-environment-hosted 500-c-integer-headers'
          make -C pa38 check CPPGM_SKIP_DEV_REBUILD=1 CXX="$CXX" CPPGM_HOST_CXX="$CPPGM_HOST_CXX" \
            TEST=tests/controls/500-c11-stdatomic.t
      - name: Record native C clause evidence
        if: matrix.llvm == 21
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/c-conformance"
          python3 scripts/c_conformance.py probe --output "$work" --report \
            | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Store C clause evidence
        if: always() && matrix.llvm == 21
        uses: actions/upload-artifact@v6
        with:
          name: c-conformance-darwin-x86_64
          path: ${{ runner.temp }}/c-conformance
          if-no-files-found: ignore
          retention-days: 7
      - name: Install pinned Wasm validation tools
        run: |
          perl scripts/install_wasm_tools.pl --prefix "$RUNNER_TEMP/wasm-tools" --benchmark-engine
          echo "$RUNNER_TEMP/wasm-tools/bin" >> "$GITHUB_PATH"
          echo "CPPGM_WASM_C_API=$RUNNER_TEMP/wasm-tools/wasmtime-c-api" >> "$GITHUB_ENV"
      - name: Check child resource limits and cancellation
        run: python3 scripts/tests/test_command_resources.py
      - name: Check comparison harness on macOS
        if: matrix.llvm == 21
        run: python3 scripts/tests/test_compare_lowir_results.py LowIrComparisonTest ParallelLowIrComparisonTest
      - name: Run the default Intel macOS test report
        run: |
          make --no-print-directory -f Makefile -f - ci-report-config <<'MAKE'
          ci-report-config:; @echo "Report parallelism: $(TEST_REPORT_ASSIGNMENT_JOBS) assignments x $(TEST_REPORT_SUBTEST_JOBS) workers ($(DEFAULT_BUILD_JOBS) CPUs)"
          MAKE
          /usr/bin/time -lp make test-report CXX="$CXX" CPPGM_HOST_CXX="$CPPGM_HOST_CXX"
      - name: Check optional target features
        run: make test-target-features-nobuild CXX="$CXX" CPPGM_HOST_CXX="$CPPGM_HOST_CXX"
      - name: Compare self-built and inception compilers
        run: |
          make -C pa35 cppgm-self CXX=../dev/cppgm CPPGM_HOST_CXX="$CPPGM_HOST_CXX" \
            INCEPTION_BUILD_JOBS=4 INCEPTION_OBJECT_BUILD_JOBS=4
          make -C pa35 compare-cppgm-inception CXX=../dev/cppgm CPPGM_HOST_CXX="$CPPGM_HOST_CXX" \
            INCEPTION_BUILD_JOBS=4 INCEPTION_OBJECT_BUILD_JOBS=4
      - name: Retain failing test diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: macos-llvm-${{ matrix.llvm }}-diagnostics
          path: |
            pa*/tests/**/*.my*.stderr
            pa*/tests/**/*.my*.stdout
            pa*/tests/**/*.my*.exit_status
            pa*/tests/**/*.my*.inspect
            pa*/tests/**/*.my*.link_command
            pa*/tests/**/*.my*.link_verbose
            pa*/tests/**/*.my*.unresolved_symbols
            pa*/tests/**/*.check*.stderr
            pa*/tests/**/*.check*.stdout
            pa*/tests/**/*.check*.exit_status
            pa*/tests/**/*.check*.link_command
            pa*/tests/**/*.check*.link_verbose
            pa*/tests/**/*.check*.unresolved_symbols
          retention-days: 7
